; PHP settings for this site only (PHP-FPM reads .user.ini from the web root, re-read within 5 minutes).
; Lets the Importer accept large CSV uploads and the CP accept large images. Matches client_max_body_size in deploy/nginx-snippet.conf.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
