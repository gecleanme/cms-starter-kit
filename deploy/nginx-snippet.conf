# Forge > project-name-cms site > Nginx config (Edit Files > Edit Nginx Configuration).
#
# PART A (safe, recommended): paste inside the `server { ... }` block, under the `server_name` line.
# Only affects this site.
add_header X-Robots-Tag "noindex, nofollow" always;   # keep the CMS out of Google
client_max_body_size 64M;                             # allow larger image uploads to this site

# PART B (OPTIONAL rate limit for form posts, skip it on day one).
# The zone line goes in the server-wide http context and is shared by EVERY site on this server,
# so only add it if you are comfortable with that. Both lines must be added together:
# if the location block references a zone that does not exist, nginx refuses the config.
#
# B1 - Forge > Server > Nginx > "before" include (or the top of this site file, above `server {`):
# limit_req_zone $binary_remote_addr zone=project_name_cms_forms:10m rate=10r/m;
#
# B2 - inside the `server { ... }` block of this site:
# location ~ ^/!/forms/ {
#     limit_req zone=project_name_cms_forms burst=5 nodelay;
#     try_files $uri $uri/ /index.php?$query_string;
# }
