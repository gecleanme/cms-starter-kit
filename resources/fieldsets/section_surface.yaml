title: 'Section settings (surface + anchor)'
# Semantic surface names, mapped in Nuxt to theme tokens:
# default -> bg-bg-primary, subtle -> bg-fg-quinary, brand -> bg-brand-2, accent -> bg-brand-1
fields:
  -
    handle: surface
    field:
      type: button_group
      display: Background
      options:
        default: Default
        subtle: Subtle
        brand: Brand
        accent: Accent
      default: default
  -
    handle: anchor_id
    field:
      type: slug
      display: 'Anchor ID (optional)'
      instructions: 'Lets menus link straight to this section, e.g. "faqs" for /resources/#faqs.'
      validate:
        - nullable
        - alpha_dash
