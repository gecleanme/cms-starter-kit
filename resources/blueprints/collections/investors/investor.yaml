title: Investor
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Title
          required: true
          validate:
          - required
      - handle: logo
        field:
          type: assets
          container: assets
          max_files: 1
          display: Logo
      - import: rich_content
  legacy:
    display: WordPress
    sections:
    - fields:
      - import: legacy
  sidebar:
    display: Sidebar
    sections:
    - fields:
      - handle: slug
        field:
          type: slug
          display: Slug
          validate:
          - max:200
