title: Workload
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Title
          required: true
          validate:
          - required
      - handle: excerpt
        field:
          type: textarea
          display: Excerpt
      - handle: featured_image
        field:
          type: assets
          container: assets
          max_files: 1
          display: Featured image
      - import: rich_content
      - handle: features
        field:
          type: grid
          display: Key features
          mode: stacked
          fields:
          - handle: title
            field:
              type: text
              display: Title
          - handle: description
            field:
              type: bard
              display: Description
              container: assets
              buttons:
              - bold
              - italic
              - anchor
              - unorderedlist
              save_html: false
          - handle: icon
            field:
              type: assets
              container: assets
              max_files: 1
              display: Icon
  seo:
    display: SEO
    sections:
    - fields:
      - import: seo
  legacy:
    display: WordPress
    sections:
    - fields:
      - import: legacy
  sidebar:
    display: Sidebar
    sections:
    - fields:
      - handle: slug
        field:
          type: slug
          display: Slug
          validate:
          - max:200
