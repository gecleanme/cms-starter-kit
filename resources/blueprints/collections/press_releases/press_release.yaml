title: Press Release
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: title
        field:
          type: text
          display: Title
          required: true
          validate:
          - required
      - handle: featured_image
        field:
          type: assets
          container: assets
          max_files: 1
          display: Featured image
      - handle: description
        field:
          type: bard
          container: assets
          display: Description
          buttons:
          - h3
          - bold
          - italic
          - unorderedlist
          - orderedlist
          - anchor
          save_html: false
      - handle: publisher
        field:
          type: textarea
          display: Author / publisher
          instructions: 'Example: Hosted/Written by …  (was ACF "Author").'
      - handle: publisher_description
        field:
          type: bard
          container: assets
          display: Publisher description
          buttons:
          - bold
          - italic
          - anchor
          save_html: false
      - handle: logo
        field:
          type: assets
          container: assets
          max_files: 1
          display: Publisher logo
  legacy:
    display: WordPress
    sections:
    - fields:
      - import: legacy
  sidebar:
    display: Sidebar
    sections:
    - fields:
      - handle: date
        field:
          type: date
          display: Date
          validate:
          - required
      - handle: link_text
        field:
          type: text
          display: Link text
      - handle: link_url
        field:
          type: text
          input_type: url
          display: Link URL
      - handle: slug
        field:
          type: slug
          display: Slug
          validate:
          - max:200
