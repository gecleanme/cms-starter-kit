title: Site Settings
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: logo
        field:
          type: assets
          container: assets
          max_files: 1
          display: Logo
      - handle: company_email
        field:
          type: text
          input_type: email
          display: Company email
      - handle: company_location
        field:
          type: textarea
          display: Company address
      - handle: social_links
        field:
          type: grid
          display: Social links
          mode: table
          fields:
          - handle: platform
            field:
              type: select
              display: Platform
              options:
                facebook: Facebook
                x: X (Twitter)
                instagram: Instagram
                linkedin: LinkedIn
                youtube: YouTube
          - handle: url
            field:
              type: text
              input_type: url
              display: URL
      - handle: copyright
        field:
          type: text
          display: Copyright line
