title: Contact
tabs:
  main:
    display: Main
    sections:
    - fields:
      - handle: first_name
        field:
          type: text
          display: First name
          validate:
          - required
          - max:100
          width: 50
      - handle: last_name
        field:
          type: text
          display: Last name
          validate:
          - required
          - max:100
          width: 50
      - handle: company
        field:
          type: text
          display: Company
          validate:
          - nullable
          - max:200
      - handle: email
        field:
          type: text
          input_type: email
          display: Email
          validate:
          - required
          - email:rfc
          - max:200
      - handle: phone
        field:
          type: text
          input_type: tel
          display: Phone
          validate:
          - required
          - max:40
      - handle: workloads
        field:
          type: checkboxes
          display: Select any workloads that pertain to you
          options:
            Architecture & Design: Architecture & Design
            Product Design: Product Design
            Game Development: Game Development
            Film & TV: Film & TV
            Engineering: Engineering
            HPC: HPC
            VR & AR: VR & AR
            Broadcast: Broadcast
      - handle: message
        field:
          type: textarea
          display: Message
          validate:
          - nullable
          - max:5000
